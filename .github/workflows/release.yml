name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Build binary
        run: ./scripts/build-binary.sh ${{ matrix.arch }}
      - name: Build .mcpb bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-mcpb.sh ${{ matrix.arch }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/missing-omnifocus-mcp-macos-${{ matrix.arch }}
            dist/missing-omnifocus-mcp-macos-${{ matrix.arch }}.mcpb
