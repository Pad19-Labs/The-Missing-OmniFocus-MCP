name: release

on:
  push:
    tags: ['v*']

jobs:
  # Build with NO repository secrets or write token in scope.
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
      - name: Build binaries (both architectures)
        run: |
          ./scripts/build-binary.sh arm64
          ./scripts/build-binary.sh x86_64
      - name: Build .mcpb bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-mcpb.sh arm64
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-mcpb.sh x86_64
      - name: Checksums
        run: (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Upload artifacts for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Publish in a separate job that holds the write token but builds nothing.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
